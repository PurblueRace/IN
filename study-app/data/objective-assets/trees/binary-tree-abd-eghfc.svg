<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="title desc">
  <title id="title">Binary tree with nodes A through H</title>
  <desc id="desc">A is the root. A has left child B and right child C. B has left child D. C has left child E and right child F. E has left child G and right child H.</desc>
  <rect width="560" height="340" rx="24" fill="#F8FBFF"/>
  <g stroke="#6B7684" stroke-width="5" stroke-linecap="round">
    <line x1="280" y1="60" x2="165" y2="135"/>
    <line x1="280" y1="60" x2="395" y2="135"/>
    <line x1="165" y1="135" x2="105" y2="215"/>
    <line x1="395" y1="135" x2="335" y2="215"/>
    <line x1="395" y1="135" x2="455" y2="215"/>
    <line x1="335" y1="215" x2="280" y2="290"/>
    <line x1="335" y1="215" x2="390" y2="290"/>
  </g>
  <g font-family="Pretendard, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle" dominant-baseline="middle">
    <g>
      <circle cx="280" cy="55" r="32" fill="#3182F6"/>
      <text x="280" y="57" fill="#FFFFFF">A</text>
    </g>
    <g>
      <circle cx="165" cy="140" r="32" fill="#FFFFFF" stroke="#3182F6" stroke-width="4"/>
      <text x="165" y="142" fill="#191F28">B</text>
    </g>
    <g>
      <circle cx="395" cy="140" r="32" fill="#FFFFFF" stroke="#3182F6" stroke-width="4"/>
      <text x="395" y="142" fill="#191F28">C</text>
    </g>
    <g>
      <circle cx="105" cy="220" r="32" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="105" y="222" fill="#191F28">D</text>
    </g>
    <g>
      <circle cx="335" cy="220" r="32" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="335" y="222" fill="#191F28">E</text>
    </g>
    <g>
      <circle cx="455" cy="220" r="32" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="455" y="222" fill="#191F28">F</text>
    </g>
    <g>
      <circle cx="280" cy="300" r="32" fill="#FFFFFF" stroke="#FF9500" stroke-width="4"/>
      <text x="280" y="302" fill="#191F28">G</text>
    </g>
    <g>
      <circle cx="390" cy="300" r="32" fill="#FFFFFF" stroke="#FF9500" stroke-width="4"/>
      <text x="390" y="302" fill="#191F28">H</text>
    </g>
  </g>
</svg>
