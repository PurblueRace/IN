<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" role="img" aria-labelledby="title desc">
  <title id="title">Operator tree for preorder traversal</title>
  <desc id="desc">The root is plus. Its left child is multiplication and right child is E. The left multiplication has left child multiplication and right child D. That multiplication has left child division and right child C. Division has left child A and right child B.</desc>
  <rect width="620" height="380" rx="24" fill="#F8FBFF"/>
  <g stroke="#6B7684" stroke-width="5" stroke-linecap="round">
    <line x1="310" y1="55" x2="245" y2="125"/>
    <line x1="310" y1="55" x2="455" y2="125"/>
    <line x1="245" y1="125" x2="185" y2="195"/>
    <line x1="245" y1="125" x2="320" y2="195"/>
    <line x1="185" y1="195" x2="125" y2="265"/>
    <line x1="185" y1="195" x2="245" y2="265"/>
    <line x1="125" y1="265" x2="80" y2="335"/>
    <line x1="125" y1="265" x2="170" y2="335"/>
  </g>
  <g font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="900" text-anchor="middle" dominant-baseline="middle">
    <g>
      <circle cx="310" cy="50" r="32" fill="#3182F6"/>
      <text x="310" y="52" fill="#FFFFFF">+</text>
    </g>
    <g>
      <circle cx="245" cy="130" r="32" fill="#FFFFFF" stroke="#3182F6" stroke-width="4"/>
      <text x="245" y="132" fill="#191F28">*</text>
    </g>
    <g>
      <circle cx="455" cy="130" r="32" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="455" y="132" fill="#191F28">E</text>
    </g>
    <g>
      <circle cx="185" cy="200" r="32" fill="#FFFFFF" stroke="#3182F6" stroke-width="4"/>
      <text x="185" y="202" fill="#191F28">*</text>
    </g>
    <g>
      <circle cx="320" cy="200" r="32" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="320" y="202" fill="#191F28">D</text>
    </g>
    <g>
      <circle cx="125" cy="270" r="32" fill="#FFFFFF" stroke="#3182F6" stroke-width="4"/>
      <text x="125" y="272" fill="#191F28">/</text>
    </g>
    <g>
      <circle cx="245" cy="270" r="32" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="245" y="272" fill="#191F28">C</text>
    </g>
    <g>
      <circle cx="80" cy="342" r="32" fill="#FFFFFF" stroke="#FF9500" stroke-width="4"/>
      <text x="80" y="344" fill="#191F28">A</text>
    </g>
    <g>
      <circle cx="170" cy="342" r="32" fill="#FFFFFF" stroke="#FF9500" stroke-width="4"/>
      <text x="170" y="344" fill="#191F28">B</text>
    </g>
  </g>
</svg>
