<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Binary tree with nodes A, B, C, D, E, F</title>
  <desc id="desc">A is the root. A has left child B and right child C. B has left child D. C has left child E and right child F.</desc>
  <rect width="520" height="300" rx="24" fill="#F8FBFF"/>
  <g stroke="#6B7684" stroke-width="5" stroke-linecap="round">
    <line x1="260" y1="70" x2="150" y2="145"/>
    <line x1="260" y1="70" x2="370" y2="145"/>
    <line x1="150" y1="145" x2="95" y2="220"/>
    <line x1="370" y1="145" x2="315" y2="220"/>
    <line x1="370" y1="145" x2="425" y2="220"/>
  </g>
  <g font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle" dominant-baseline="middle">
    <g>
      <circle cx="260" cy="60" r="34" fill="#3182F6"/>
      <text x="260" y="62" fill="#FFFFFF">A</text>
    </g>
    <g>
      <circle cx="150" cy="150" r="34" fill="#FFFFFF" stroke="#3182F6" stroke-width="4"/>
      <text x="150" y="152" fill="#191F28">B</text>
    </g>
    <g>
      <circle cx="370" cy="150" r="34" fill="#FFFFFF" stroke="#3182F6" stroke-width="4"/>
      <text x="370" y="152" fill="#191F28">C</text>
    </g>
    <g>
      <circle cx="95" cy="230" r="34" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="95" y="232" fill="#191F28">D</text>
    </g>
    <g>
      <circle cx="315" cy="230" r="34" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="315" y="232" fill="#191F28">E</text>
    </g>
    <g>
      <circle cx="425" cy="230" r="34" fill="#FFFFFF" stroke="#30C85E" stroke-width="4"/>
      <text x="425" y="232" fill="#191F28">F</text>
    </g>
  </g>
</svg>
